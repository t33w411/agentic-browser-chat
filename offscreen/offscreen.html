<!DOCTYPE html>
<html>
<body>
  <audio id="reminder-audio" src="../sounds/reminder.wav"></audio>
  <script src="offscreen.js"></script>

  <!-- Shared read-aloud audio cache. Loaded early so its message listener is registered before the
       heavier agent scripts below, shrinking the window where a just-created offscreen document could
       drop the first cache PUT. -->
  <script src="ttsAudioCache.js"></script>

  <!-- Agent run loop host. The orchestration loop runs here (not in the page content
       script) so an in-flight run survives a page reload. Scripts are loaded in the
       same dependency order the manifest uses for the content script. Page-DOM-bound
       tools (page_observe, page_act, page_read, page_spreadsheet, take_screenshot
       capture) are delegated back to the target tab's content script; everything else
       runs here. -->
  <script src="../shared/messages.js"></script>
  <script src="../shared/agentRunStop.js"></script>
  <script src="../shared/toolRegistry.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="../shared/panelDataRepo.js"></script>
  <script src="../lib/jszip.min.js"></script>
  <script src="../lib/xlsx.min.js"></script>
  <script src="../agent/apiLogger.js"></script>

  <!-- Scanned-PDF transcription. Hosted here rather than in the service worker because it is a
       network-bound job that can run for minutes, which a service worker's idle timer does not
       survive. pdfRaster lazy-loads pdf.js on first use, so the library is not paid for on every
       run, and pdfOcr logs through the apiLogger loaded above. -->
  <script src="pdfRaster.js"></script>
  <script src="pdfOcr.js"></script>

  <script src="../agent/tools.js"></script>
  <script src="../agent/documentGeneration.js"></script>
  <script src="../agent/cdpClient.js"></script>
  <script src="../agent/toolExec.js"></script>
  <script src="../agent/contextBuilder.js"></script>
  <script src="../agent/client.js"></script>
  <script src="../agent/compactor.js"></script>
  <script src="../agent/pageMutatorBatchGate.js"></script>
  <script src="../agent/hooks/registry.js"></script>
  <script src="../agent/hooks/builtin/memoryClaimGuard.js"></script>
  <script src="../agent/hooks/builtin/imageGenerationCap.js"></script>
  <script src="../agent/hooks/builtin/toolCallCap.js"></script>
  <script src="agentRun.js"></script>
</body>
</html>
